[default.extend-identifiers]
# Preserve the format plural before typos splits its acronym.
PNGs = "PNGs"

# Words typos must leave alone. Add your own below.
[default.extend-words]
# NumPy's API spells it this way (`array.flags.writeable`).
writeable = "writeable"
WRITEABLE = "WRITEABLE"
# Material abbreviations in the vocabulary.
TPE = "TPE"
NdFeB = "NdFeB"
Nd = "Nd"
# Latin-1 test fixture: `caf` is the start of an escaped "café".
caf = "caf"

# R9lab tags are kept as users typed them, misspellings included.
[files]
extend-exclude = ["mappings/r9lab-tags.sssom.tsv"]
