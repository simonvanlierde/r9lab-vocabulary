name: python

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Weekly, to catch a publisher revising its data. This is the only run that sets TRIPWIRE.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is in the group because a queued run replaces a pending one in its group
  # whatever cancel-in-progress says, so a push to main must not wait beside the weekly run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Only a newer push to the same pull request cancels a run. A push to main must not cancel
  # the weekly scheduled run, or that week's revision report is lost.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv checks every package against OSV's malware advisories before its code
  # runs, and fails if OSV is unreachable. The preview flag only silences the
  # "experimental" warning.
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: malware-check

jobs:
  check:
    name: "python: lint, types, pipeline, tests"
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Saved off pull requests only: a cache a pull request saves is readable by that
      # pull request alone, and it pushes main's entries out of the 10 GB per-repo limit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' }}
          version: "0.13.6"

      - run: uv sync --locked
      # Checks every locked dependency, dev group included, against the OSV database
      # for known vulnerabilities and deprecated or quarantined projects. Still
      # experimental in uv, hence the preview flag.
      - run: uv audit --locked --preview-features audit-command
      # Lists the license of each locked package that ships (no dependency groups), read
      # from the installed metadata, and fails on one licensecheck's compatibility table
      # says the license in pyproject.toml cannot take. With no runtime dependencies there
      # is nothing to check, and licensecheck --zero would fail on the empty list.
      - run: uv export --locked --no-default-groups --no-hashes --no-annotate --no-header --no-emit-project -q -o "$RUNNER_TEMP/requirements.txt"
      - run: test ! -s "$RUNNER_TEMP/requirements.txt" || uv run --locked --with licensecheck==2026.0.8 licensecheck -r "$RUNNER_TEMP/requirements.txt" --zero

      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run ty check

      # The committed fetch log, before fetch appends to it, for the revisions report below.
      - run: cp data/fetches.jsonl "$RUNNER_TEMP/fetches-before.jsonl" 2>/dev/null || touch "$RUNNER_TEMP/fetches-before.jsonl"

      # Runs the pipeline against the URLs in sources.toml, not a fixture. Keep each URL a
      # small cut of its source so this stays fast.
      - id: fetch
        run: uv run r9lab-vocabulary fetch
      # The sources whose bytes changed since the committed log. Weekly only: on a pull
      # request, a revision is noise. The text form prints "no revisions" when none changed,
      # so the JSON list decides whether there is a report at all.
      - if: github.event_name == 'schedule'
        run: |-
          before="$RUNNER_TEMP/fetches-before.jsonl"
          uv run r9lab-vocabulary revisions --json "$before" >"$RUNNER_TEMP/revisions.json"
          if jq -e '.revisions | length > 0' "$RUNNER_TEMP/revisions.json" >/dev/null; then
            uv run r9lab-vocabulary revisions "$before" >"$RUNNER_TEMP/revisions.md"
          fi
      - run: uv run r9lab-vocabulary build
      - run: uv run r9lab-vocabulary validate

      # dist/, as `just rdf` writes it, and its SSSOM file checked against the SSSOM schema
      # as `just sssom-validate` does. Not in the template: keep these on a copier update.
      - run: uv run r9lab-vocabulary rdf
      - run: uvx --exclude-newer "1 week" --from sssom==0.4.22 sssom validate dist/r9lab-vocabulary.sssom.tsv

      # The release folder `just data-release` writes, checked as `just data-release-check` does.
      - run: uv run r9lab-vocabulary release "$RUNNER_TEMP/release"
      - run: uv run r9lab-vocabulary release --check "$RUNNER_TEMP/release"

      # tests/test_published.py fails, not skips, when the output is missing. TRIPWIRE
      # turns on tests/test_live.py, the live Wikidata check, on the weekly schedule only.
      # A publisher revision of a source with a `sha256` pin fails `fetch` above on every
      # run, pull requests included.
      - run: uv run pytest
        env:
          PIPELINE_OUTPUT_REQUIRED: "1"
          TRIPWIRE: ${{ github.event_name == 'schedule' && '1' || '' }}

      # Fetch records only: URL, timestamp, checksum, byte count, vintage. They hold
      # no source values, so the artifact redistributes nothing (see ATTRIBUTION.md).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # After a failed build or validate too, but not when fetch never ran.
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        with:
          name: fetch-records
          path: data/raw/*.fetch.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.fetch.outcome == 'success' }}
        with:
          name: revisions
          path: ${{ runner.temp }}/revisions.md
          # No file when no source changed: then there is nothing to report.
          if-no-files-found: ignore

  revisions:
    # Weekly only. Comments on one open issue when a publisher served new bytes for a
    # source the committed fetch log already had. Only a source with no `sha256` pin can
    # produce that report, and every implemented source here is pinned: new bytes for a
    # pinned one fail `fetch`, this job finds no report, and `notify` reports the failure.
    name: report revised sources
    needs: check
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Missing when fetch failed or no source changed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: revisions
          path: ${{ runner.temp }}/revisions
      - name: comment on the revisions issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          report="$RUNNER_TEMP/revisions/revisions.md"
          [ -s "$report" ] || exit 0
          title="Source data revised upstream"
          {
            echo "The weekly run fetched new bytes for these sources:"
            echo
            cat "$report"
            echo
            echo "Run \`just pipeline\` and commit \`data/fetches.jsonl\` to record them."
          } >"$RUNNER_TEMP/body.md"
          issue=$(gh issue list --state open --author app/github-actions --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

  notify:
    # Scheduled runs only. A tripwire or pinned-fetch failure is the weekly run's signal, so it opens one
    # issue, or comments on the open one.
    name: "python: report failure"
    needs: [check, revisions]
    # A job that runs past timeout-minutes ends cancelled, not failed.
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      issues: write # opens or comments on the failure issue
    uses: $/.github/workflows/report-failure.yml
    with:
      title: Weekly pipeline run failed
