#:schema https://raw.githubusercontent.com/simonvanlierde/sourceledger/v0.5.0/src/sourceledger/sources.schema.json

output_format = "parquet"

# The reference files the vocabulary's crosswalks are checked against. `just fetch`
# downloads each to data/raw/, `just build` turns it into data/processed/<id>.parquet,
# and `just rdf` refuses a CPC code or PMDco IRI that is not in them.
# Field reference: https://github.com/simonvanlierde/sourceledger (sources.toml).

[[source]]
id = "cpc21"
name = "UN Central Product Classification (CPC) Version 2.1, structure file"
status = "implemented"
url = "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_2_1_english_structure.txt"
vintage = "CPC Ver. 2.1 (English)"
sha256 = "1c3e88e5fa67b9ba0d27594cb3363f717321f58fe0308be60b326ebf927c1b92"
terms = "United Nations website terms of use"
terms_url = "https://www.un.org/en/about-us/terms-of-use"
license = "LicenseRef-UN-Terms-of-Use"
redistribute = false

[[source]]
id = "pmdco"
name = "Platform MaterialDigital core ontology (PMDco) v3.1.2"
status = "implemented"
url = "https://raw.githubusercontent.com/materialdigital/core-ontology/v3.1.2/pmdco.ttl"
vintage = "v3.1.2"
sha256 = "bd5093e354c553b0fcca264c78d7048660ccd443637e1933cd7b6cffe779a862"
terms = "Attribution 4.0 International"
terms_url = "https://github.com/materialdigital/core-ontology/blob/v3.1.2/LICENSE.txt"
license = "CC-BY-4.0"
redistribute = true

[[source]]
id = "unu-keys-v2"
name = "E-waste Statistics Guidelines, third edition (UNU-KEYs v2 and CPC 2.1 concordance)"
status = "unimplemented"
reason = "Tables are in a PDF under CC BY-NC-SA 4.0. The v1 and v2 code lists (Tables 19 and 2) are typed into FIXED_CODES in scheme.py, read from the PDF with SHA-256 605617fd390e202e74900b740e9a79d58d7ffb5d18a6fab4c75716df16c43570; the scheme points to codes and copies no names."

# BAFU releases, one source each, read for activity names only: `just rdf` fails when a
# `bafu` pattern matches no live activity in a release it applies to. Add the next
# release as one more block (id `bafu-<year>-v<n>`); the YAML keys releases by the part
# after `bafu-`. The terms bar redistributing the data, so `redistribute = false` keeps
# both out of the data release. Mirrors on files.brightway.dev, the same bytes Brightway
# installs; the official route is openLCA Nexus (https://nexus.openlca.org/database/BAFU).
[[source]]
id = "bafu-2025-v2"
name = "Life Cycle Inventory database of the Swiss Federal Administration, BAFU:2025 v2 (Brightway project)"
status = "implemented"
url = "https://files.brightway.dev/bafu-2025-v2.tar.gz"
vintage = "BAFU:2025 v2"
sha256 = "54cb370abba22ad1f6a9f6f9ef65f9fbad5a496fdf785cd5ad9517701b47a38e"
terms = "BAFU:20XY Terms of Use (FOEN, 23 June 2026)"
