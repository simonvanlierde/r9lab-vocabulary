# Material classes. Top level: Ashby's six material families (metals, polymers,
# elastomers, glasses, ceramics, hybrids; Ashby, Materials Selection in Mechanical
# Design, 5th ed., 2017, section 2.2, Fig. 2.1). Levels 1-2 are the coarse classes;
# the leaves are the finer arm (polymer families, alloys), used where a record names a
# grade.
#
# Mappings: cpc = CPC 2.1 subclass for the material in primary or semi-finished form
# (close when the subclass is that material, broad when it covers more); pmdco = PMDco
# v3.1.2; wd = Wikidata. `names` holds candidate regular expressions per name list
# (`bafu`: BAFU activity names), matched case-insensitively (Python `re.search`) against
# every version of that list in sources.toml (withdrawn "xx" BAFU datasets skipped).
# `just rdf` fails on a pattern that matches nothing, and the published tests on a branch
# of a (a|b) group that matches nothing. A name only some versions use goes in as
# `{pattern: '...', versions: [2026-v1]}`. `just names` lists what each pattern catches.
# Ids are opaque and never reused: deprecate, never delete.
scheme:
  slug: materials
  id_letter: m
  title: R9lab material classes
  created: 2026-11-17
  description: >
    Material classes for parts recovered from disassembled products, topped by Ashby's six
    material families, with crosswalks to CPC 2.1, PMDco, Wikidata and BAFU activity names.
concepts:
  m0001:
    label: metal
    definition: 'Metallic elements and their alloys: dense, conductive and ductile, Ashby''s metal family.'
    source: Ashby, Materials Selection in Mechanical Design, 5th ed., 2017, sec. 2.2
    example: [steel, aluminium, copper, solder]
    note: 'Not ceramic: metal oxides such as ferrite are ceramics. Not hybrid: a metal-plated plastic part goes by its main material.'
    mappings: {exact: ['pmdco:PMD_0000852', 'wd:Q11426']}
  m0002:
    label: ferrous metal
    definition: Iron and alloys based on iron, such as steel and cast iron.
    source: Ashby, Materials Selection in Mechanical Design, 5th ed., 2017
    example: [sheet steel, stainless steel 18/8, grey cast iron]
    note: 'Not non-ferrous metal: alloys based on chromium, manganese, cobalt or nickel are non-ferrous.'
    editorial_note: Wikidata's ferrous metal also counts alloys based on chromium, manganese, cobalt or nickel.
    broader: [m0001]
    mappings: {exact: ['pmdco:PMD_0000639'], close: ['cpc:411', 'wd:Q65122087']}
  m0003:
    label: carbon and low-alloy steel
    definition: Non-alloy or low-alloy steel, plain or galvanised.
    source: EN 10020:2000
    example: [a steel chassis, galvanised sheet, a screw, a spring]
    note: 'Not stainless steel: at 10.5 % chromium or more it is stainless. Not cast iron: steel has under about 2 % carbon. A zinc or paint coat does not change the class.'
    broader: [m0002]
    mappings: {broad: ['pmdco:PMD_0020096', 'wd:Q11427'], close: ['cpc:41121']}
    names:
      bafu: ['^steel, (converter|electric), (unalloyed|low-alloyed)', '^steel sheet']
  m0004:
    label: stainless steel
    definition: Steel with at least 10.5 % chromium, which makes it resist corrosion.
    source: EN 10088-1:2014
    example: [a washing-machine drum, a dishwasher tub, a kettle body, a stainless screw]
    note: 'Not non-ferrous metal: it is iron-based even when a magnet does not stick to it.'
    broader: [m0002]
    mappings: {exact: ['pmdco:PMD_0010003', 'wd:Q172587'], broad: ['cpc:41122']}
    names:
      bafu: ['^chromium steel 18/8']
  m0005:
    label: cast iron
    definition: Iron-carbon alloy with more than about 2 % carbon, shaped by casting.
    source: https://www.wikidata.org/wiki/Q483269
    example: [grey cast iron, ductile iron, a cast pump housing, a cast-iron motor frame]
    note: 'Not carbon and low-alloy steel: steel has under about 2 % carbon, even when it is cast.'
    broader: [m0002]
    mappings: {exact: ['pmdco:PMD_0010002', 'wd:Q483269']}
    names:
      bafu: ['^cast iron']
  m0006:
    label: non-ferrous metal
    definition: Metals and alloys not based on iron, such as aluminium, copper, zinc, magnesium, solder and the precious metals.
    source: https://www.wikidata.org/wiki/Q5679431
    example: [an aluminium die casting, copper wire, brass, tin-silver solder]
    note: 'Not ferrous metal: stainless steel is ferrous, though some grades are not magnetic.'
    broader: [m0001]
    mappings: {exact: ['pmdco:PMD_0010007', 'wd:Q5679431']}
  m0007:
    label: aluminium alloy
    definition: Aluminium and alloys in which aluminium is the main metal, wrought or cast.
    source: https://www.wikidata.org/wiki/Q447725
    example: [an aluminium heat sink, a die-cast frame, an extruded profile, aluminium foil]
    note: Not magnesium alloy, which looks alike but is lighter. Pure aluminium is included.
    editorial_note: Wikidata's aluminium alloy leaves out pure aluminium.
    broader: [m0006]
    mappings: {exact: ['pmdco:PMD_0020186'], close: ['cpc:41431', 'wd:Q447725']}
    names:
      bafu: ['^aluminium, (primary|secondary|production mix)']
  m0008:
    label: magnesium alloy
    definition: Alloys in which magnesium is the main metal, mostly die-cast.
    source: https://www.wikidata.org/wiki/Q2180288
    example: [a die-cast laptop chassis, a camera body, a phone mid-frame]
    note: 'Not aluminium alloy: the two look alike, but magnesium is about a third lighter.'
    broader: [m0006]
    mappings: {exact: ['wd:Q2180288']}
    names:
      bafu: ['^magnesium-alloy']
  m0009:
    label: copper
    definition: Unalloyed copper, as in wire, foil, bus bars and windings.
    source: https://www.wikidata.org/wiki/Q753
    example: [copper wire, copper foil, a bus bar, enamelled winding wire]
    note: 'Not copper alloy: brass and bronze are alloys. Not cable: insulated wire is a cable, but enamelled winding wire in a coil, motor or transformer is copper.'
    broader: [m0006]
    mappings: {exact: ['wd:Q753'], broad: ['cpc:41413']}
    names:
      bafu: ['^copper, (primary|secondary|at regional storage)', '^copper sheet']
  m0010:
    label: copper alloy
    definition: Alloys in which copper is the main metal, such as brass, bronze and copper-beryllium.
    source: https://w3id.org/pmd/co/PMD_0020187
    example: [brass, phosphor bronze, a copper-beryllium contact spring, a bronze bushing]
    note: 'Not copper: unalloyed copper is its own concept. Not solder, which is tin-based.'
    broader: [m0006]
    mappings: {exact: ['pmdco:PMD_0020187'], broad: ['cpc:41413']}
    names:
      bafu: ['^bronze']
  m0011:
    label: brass
    definition: Alloy of copper and zinc.
    source: https://www.wikidata.org/wiki/Q39782
    example: [a brass connector pin, a threaded brass insert, a valve body]
    note: 'Not bronze: copper with tin is copper alloy, not brass.'
    broader: [m0010]
    mappings: {exact: ['wd:Q39782']}
    names:
      bafu: ['^brass']
  m0012:
    label: zinc
    definition: Zinc and alloys based on zinc, as in die-cast housings and fittings.
    source: https://www.wikidata.org/wiki/Q758
    example: [a zinc-alloy die-cast housing, a zinc die-cast handle, zinc sheet, a zinc anode]
    note: 'Not carbon and low-alloy steel: galvanised steel goes by its steel. Not brass: copper-zinc alloy is a copper alloy. Zinc-based alloys are included.'
    editorial_note: Wikidata's zinc is the element only.
    broader: [m0006]
    mappings: {close: ['cpc:41442', 'wd:Q758']}
    names:
      bafu: ['^zinc, primary']
  m0013:
    label: tin
    definition: Tin and alloys based on tin, other than solder.
    source: https://www.wikidata.org/wiki/Q1096
    example: [pewter, a tin ingot, tin plating listed on its own in a material declaration]
    note: 'Not solder: a tin-based alloy that joins parts is solder. Tinplate and other tin-plated parts go by their base metal unless the record lists the plating by itself. Tin-based alloys are included.'
    editorial_note: Wikidata's tin is the element only.
    broader: [m0006]
    mappings: {close: ['cpc:41443', 'wd:Q1096']}
    names:
      bafu: ['^tin, ']
  m0014:
    label: nickel
    definition: Nickel and alloys based on nickel, as in battery connector strip, plating and heating wire.
    source: https://www.wikidata.org/wiki/Q744
    example: [nickel strip from a battery pack, nichrome heating wire, nickel plating listed on its own, a nickel-based superalloy part]
    note: 'Not stainless steel: steel that contains nickel is still ferrous. Nickel-plated parts go by their base metal unless the record lists the plating by itself. Nickel-based alloys are included.'
    editorial_note: Wikidata's nickel is the element only.
    broader: [m0006]
    mappings: {close: ['wd:Q744'], broad: ['cpc:4142']}
    names:
      bafu: ['^nickel, 99\.5%']
  m0015:
    label: solder
    definition: Low-melting alloy, mostly tin-based, that joins electronic components to a board.
    source: https://www.wikidata.org/wiki/Q866612
    example: [tin-silver-copper solder, tin-lead solder, solder paste, solder wire]
    note: 'Not brazing alloy: an alloy that melts above about 450 °C brazes rather than solders, and goes by its main metal.'
    editorial_note: Wikidata's solder also covers joining any metal pieces; here it is the electronics solder.
    broader: [m0006]
    mappings: {close: ['wd:Q866612'], broad: ['cpc:4154']}
    names:
      bafu: ['^solder, (bar|paste)']
  m0016:
    label: precious metal
    definition: Rare metals of high value that resist corrosion, such as gold, silver and the platinum group, and their alloys.
    source: https://www.wikidata.org/wiki/Q271449
    example: [platinum in a temperature sensor, rhodium plating, ruthenium in a chip resistor, a mixed precious-metal concentrate]
    note: Gold, silver and palladium have narrower concepts; other precious metals, such as platinum, rhodium and ruthenium, stay here. Plating goes by its base metal unless the record lists it on its own. Alloys are included.
    editorial_note: Wikidata's precious metal counts only the elements.
    broader: [m0006]
    mappings: {exact: ['pmdco:PMD_0010014'], close: ['cpc:413', 'wd:Q271449']}
  m0017:
    label: gold
    definition: Gold and alloys based on gold, as in bonding wire, contact plating and jewellery.
    source: https://www.wikidata.org/wiki/Q897
    example: [gold bonding wire, gold-plated connector pins, gold fingers on a circuit board edge, an 18-carat gold watch case]
    note: 'Not brass: a gold-coloured part is often brass. Gold-plated parts go by their base metal unless the record lists the plating by itself. Gold alloys are included.'
    editorial_note: Wikidata's gold is the element only.
    broader: [m0016]
    mappings: {exact: ['pmdco:PMD_0010015'], close: ['cpc:4132', 'wd:Q897']}
    names:
      bafu: ['^gold\b']
  m0018:
    label: silver
    definition: Silver and alloys based on silver, as in electrical contacts, conductive paste and plating.
    source: https://www.wikidata.org/wiki/Q1090
    example: [a silver relay contact, silver paste on a solar cell, silver-plated wire, sterling silver]
    note: 'Not solder: tin-silver solder is solder. Silver-plated parts go by their base metal unless the record lists the plating by itself. Silver alloys are included.'
    editorial_note: Wikidata's silver is the element only.
    broader: [m0016]
    mappings: {exact: ['pmdco:PMD_0010016'], close: ['cpc:4131', 'wd:Q1090']}
    names:
      bafu: ['^silver\b']
  m0019:
    label: palladium
    definition: Palladium and alloys based on palladium, as in contact plating, capacitor electrodes and catalysts.
    source: https://www.wikidata.org/wiki/Q1089
    example: [palladium-nickel plating on a connector contact, palladium plating listed on its own in a material declaration, palladium in a catalytic converter coating]
    note: 'Not silver: a silver-palladium alloy that is mostly silver is silver. Plated parts go by their base metal unless the record lists the plating by itself. Palladium alloys are included.'
    editorial_note: Wikidata's palladium is the element only.
    broader: [m0016]
    mappings: {exact: ['pmdco:PMD_0010018'], close: ['wd:Q1089']}
    names:
      bafu: ['^palladium']
  m0020:
    label: polymer
    definition: 'Plastics: thermoplastic and thermosetting polymers, Ashby''s polymer family.'
    source: Ashby, Materials Selection in Mechanical Design, 5th ed., 2017, sec. 2.2
    example: [ABS, polycarbonate, polypropylene, epoxy resin]
    note: 'Not elastomer: rubbers are a family of their own.'
    editorial_note: Wikidata's polymer also covers rubbers and biopolymers.
    mappings: {close: ['pmdco:PMD_0000888', 'wd:Q81163', 'cpc:347']}
  m0021:
    label: thermoplastic
    definition: Polymer that softens on heating and can be remelted.
    source: https://www.wikidata.org/wiki/Q380677
    example: [ABS, polypropylene, polycarbonate, a nylon gear]
    note: 'Not thermoset: a resin that has cured cannot be remelted. Not thermoplastic elastomer: rubbery grades that recover their shape are elastomers. Not glass-fibre reinforced polymer: short-fibre glass-filled grades such as PA66-GF30 go by their polymer.'
    broader: [m0020]
    mappings: {exact: ['pmdco:PMD_0050004', 'wd:Q380677']}
  m0022:
    label: polyethylene
    definition: Thermoplastic made from ethylene, ranging from soft film to rigid moulded parts.
    source: https://www.wikidata.org/wiki/Q143429
    example: [an HDPE container, LDPE packaging film, PE cable sheath, a PE foam insert]
    note: 'Not polypropylene: PP is the other common polyolefin and is stiffer. Includes HDPE, LDPE and LLDPE. PE foam goes here when the record names the polymer, and to foam when it does not.'
    broader: [m0021]
    mappings: {exact: ['pmdco:PMD_0050005', 'wd:Q143429'], close: ['cpc:34710']}
    names:
      bafu: ['^polyethylene, (hdpe|ldpe|lldpe)']
  m0023:
    label: polypropylene
    definition: Thermoplastic made from propylene, light and tough, used for moulded housings, hinges and containers.
    source: https://www.wikidata.org/wiki/Q146174
    example: [a PP washing machine tub, a talc-filled PP housing, a PP living hinge, a PP battery case]
    note: 'Not polyethylene: PE is the other common polyolefin and is softer. Filled and copolymer grades of PP are included.'
    broader: [m0021]
    mappings: {exact: ['pmdco:PMD_0050009', 'wd:Q146174'], broad: ['cpc:34790']}
    names:
      bafu: ['^polypropylene']
  m0024:
    label: polystyrene
    definition: Thermoplastic polymer of styrene, solid or expanded into foam, as in housings, trays and packaging.
    source: https://www.wikidata.org/wiki/Q146243
    example: [HIPS, a refrigerator inner liner, an EPS packaging block, a clear GPPS crisper tray]
    note: 'Not ABS: it also holds styrene but is its own class. Includes general-purpose (GPPS), high-impact (HIPS) and expanded (EPS) polystyrene.'
    broader: [m0021]
    mappings: {exact: ['pmdco:PMD_0050016', 'wd:Q146243'], broad: ['cpc:34720']}
    names:
      bafu: ['^polystyrene(?! scrap)']
  m0025:
    label: ABS
    definition: Acrylonitrile butadiene styrene, a tough thermoplastic, as in moulded device housings.
    source: https://www.wikidata.org/wiki/Q143496
    example: [a printer housing, a vacuum cleaner body, a keyboard keycap, a toy brick]
    note: 'Not polycarbonate/ABS blend: a part marked PC+ABS goes there. Not polystyrene: HIPS has no acrylonitrile.'
    broader: [m0021]
    mappings: {exact: ['wd:Q143496'], broad: ['cpc:34720']}
    names:
      bafu: ['^acrylonitrile-butadiene-styrene']
  m0026:
    label: polycarbonate
    definition: Tough, often transparent thermoplastic with carbonate groups in its chain, as in housings, lenses and optical discs.
    source: https://www.wikidata.org/wiki/Q62246
    example: [PC, a clear lamp cover, a CD or DVD, a power tool housing]
    note: 'Not polycarbonate/ABS blend: a part marked PC+ABS goes there. Not glass: a clear polycarbonate panel is a polymer.'
    broader: [m0021]
    mappings: {exact: ['wd:Q62246'], broad: ['cpc:34740']}
    names:
      bafu: ['^polycarbonate, ']
  m0027:
    label: polycarbonate/ABS blend
    definition: Blend of polycarbonate and ABS, common in device housings.
    example: [PC/ABS, a laptop base marked PC+ABS, a charger case, a monitor bezel]
    note: 'Not polycarbonate or ABS: a part marked with only one of the two goes to that class.'
    editorial_note: Wikidata has no item for this blend.
    broader: [m0021]
    related: [m0025, m0026]
  m0028:
    label: acrylic (PMMA)
    definition: Poly(methyl methacrylate), a clear thermoplastic, as in light guides, display covers and lenses.
    source: https://www.wikidata.org/wiki/Q146123
    example: [an acrylic sheet, a backlight light guide plate, a lamp diffuser]
    note: 'Not glass: a clear acrylic panel is a polymer. Not polycarbonate: PC is tougher and is its own class.'
    broader: [m0021]
    mappings: {exact: ['wd:Q146123'], broad: ['cpc:34790']}
    names:
      bafu: ['^polymethyl methacrylate']
  m0029:
    label: polyvinyl chloride
    definition: Thermoplastic polymer of vinyl chloride, rigid or made flexible with plasticisers, as in cable insulation and pipes.
    source: https://www.wikidata.org/wiki/Q146368
    example: [PVC, cable insulation, a mains cord sheath, a rigid PVC conduit]
    note: 'PVC. Includes rigid and plasticised grades. Not elastomer: soft PVC sheathing is still PVC, though it bends like rubber.'
    broader: [m0021]
    mappings: {exact: ['pmdco:PMD_0050013', 'wd:Q146368'], broad: ['cpc:34730']}
    names:
      bafu: ['^polyvinylchloride, ']
  m0030:
    label: polyethylene terephthalate
    definition: Thermoplastic polyester of ethylene glycol and terephthalic acid, as in bottles, films and fibres.
    source: https://www.wikidata.org/wiki/Q145863
    example: [PET, a PET bottle, a polyester insulating film, a clear blister pack]
    note: 'PET. Not polybutylene terephthalate: PBT is a related polyester for moulded parts. Not textile: polyester fabric or felt is textile.'
    broader: [m0021]
    mappings: {exact: ['pmdco:PMD_0050019', 'wd:Q145863'], broad: ['cpc:34740']}
    names:
      bafu: ['^polyethylene terephthalate']
  m0031:
    label: polyamide
    definition: Thermoplastic with amide links in its chain, known as nylon, as in gears, cable ties and connectors.
    source: https://www.wikidata.org/wiki/Q177941
    example: [PA66, a nylon gear, a cable tie, a connector housing]
    note: 'PA6, PA66 and other nylons, including glass-filled grades such as PA66-GF30. Not textile: a nylon strap or fabric is textile.'
    editorial_note: Wikidata's polyamide also covers proteins and aramids.
    broader: [m0021]
    mappings: {exact: ['wd:Q177941'], broad: ['cpc:34790', 'wd:Q145273']}
    names:
      bafu: ['^nylon 6']
  m0032:
    label: acetal (POM)
    definition: Polyoxymethylene, a stiff, low-friction thermoplastic, as in gears, clips and slides.
    source: https://www.wikidata.org/wiki/Q146139
    example: [an acetal gear, a snap-fit clip, a drawer slide]
    note: 'Not polyamide: nylon gears look alike but are PA.'
    editorial_note: No BAFU dataset; needs a proxy.
    broader: [m0021]
    mappings: {exact: ['wd:Q146139'], broad: ['cpc:34740']}
  m0033:
    label: polybutylene terephthalate
    definition: Thermoplastic polyester of butanediol and terephthalic acid, as in connectors, switch housings and keycaps.
    source: https://www.wikidata.org/wiki/Q145445
    example: [PBT, a connector body, a relay housing, a PBT keycap]
    note: 'PBT. Not polyethylene terephthalate: PET is the related polyester for bottles, films and fibres.'
    editorial_note: No BAFU dataset; needs a proxy.
    broader: [m0021]
    mappings: {exact: ['wd:Q145445'], broad: ['cpc:34740']}
  m0034:
    label: thermoset
    definition: Polymer that cures irreversibly to a solid and cannot be remelted.
    source: https://www.wikidata.org/wiki/Q868477
    example: [epoxy potting compound, a phenolic switch housing, a melamine knob, cured polyester resin]
    note: 'Not thermoplastic: a plastic that softens again on heating is a thermoplastic. Not elastomer: vulcanised rubbers are also cross-linked but go under elastomer. Resin set around fibres, as in FR-4, is a composite.'
    broader: [m0020]
    mappings: {exact: ['pmdco:PMD_0050022', 'wd:Q868477']}
  m0035:
    label: epoxy resin
    definition: Thermoset made by curing an epoxide resin with a hardener, used as adhesive, potting, coating and laminate binder.
    source: https://www.wikidata.org/wiki/Q143983
    example: [epoxy potting in a power supply, a cast epoxy insulator, two-part epoxy adhesive, epoxy powder coating]
    note: 'Not FR-4 laminate: epoxy reinforced with glass fibre is a composite. Cured epoxy in any use counts.'
    editorial_note: Wikidata describes epoxy resin as an adhesive.
    broader: [m0034]
    mappings: {exact: ['pmdco:PMD_0050023', 'wd:Q143983'], broad: ['cpc:34740']}
    names:
      bafu: ['^epoxy resin, ']
  m0036:
    label: phenolic resin
    definition: Hard, brittle and heat-resistant thermoset made from phenol and formaldehyde.
    source: https://www.wikidata.org/wiki/Q145897
    example: [a brown phenolic plug body, a phenolic lamp socket, a brown switch housing, a phenolic pan handle]
    note: 'Phenol formaldehyde (PF), Bakelite. Not composite: paper-phenolic circuit board (FR-2) is a composite, like FR-4.'
    broader: [m0034]
    mappings: {exact: ['wd:Q145897'], broad: ['cpc:34790']}
  m0037:
    label: polyurethane
    definition: Polymer whose chains are joined by urethane links, rigid or flexible, as foam or solid.
    source: https://www.wikidata.org/wiki/Q146322
    example: [rigid PUR insulation foam from a fridge, flexible PUR foam padding, a polyurethane potting compound, polyurethane varnish]
    note: 'PUR. Not foam: PUR foam goes here. Not thermoplastic elastomer: thermoplastic polyurethane (TPU) is a thermoplastic elastomer.'
    broader: [m0020]
    mappings: {exact: ['wd:Q146322'], broad: ['cpc:34790']}
    names:
      bafu: ['^polyurethane, (flexible|rigid) foam']
  m0038:
    label: elastomer
    definition: Rubbery material of long-chain molecules that recovers its shape after large strain.
    source: Ashby, Materials Selection in Mechanical Design, 5th ed., 2017, sec. 2.2
    example: [natural rubber, silicone rubber, EPDM, a thermoplastic elastomer]
    note: 'Not polymer: a hard plastic that does not spring back is a polymer.'
    editorial_note: Wikidata files elastomers under plastics; here they are a family of their own, as in Ashby.
    mappings: {exact: ['pmdco:PMD_0050030', 'wd:Q252266']}
  m0039:
    label: natural rubber
    definition: Elastomer refined from the latex of rubber trees, mostly polyisoprene.
    source: https://www.wikidata.org/wiki/Q131877
    example: [a latex band, a natural rubber foot, a rubber drive belt, a rubber anti-vibration mount]
    note: 'Not synthetic rubber: polyisoprene made from petrochemicals is synthetic rubber, even though it is the same polymer.'
    broader: [m0038]
    mappings: {exact: ['pmdco:PMD_0050031', 'wd:Q131877']}
  m0040:
    label: synthetic rubber
    definition: Elastomer made by polymerising petrochemical monomers, such as SBR, EPDM, NBR and neoprene.
    source: https://www.wikidata.org/wiki/Q6714735
    example: [an EPDM door seal, an NBR O-ring, a chloroprene rubber gasket, an SBR rubber foot]
    note: 'Not silicone rubber or thermoplastic elastomer: both have their own concepts here.'
    editorial_note: Wikidata's synthetic rubber also counts silicone rubber, and PMDco's silicone rubber is a kind of synthetic rubber.
    broader: [m0038]
    mappings: {close: ['cpc:34800', 'wd:Q6714735', 'pmdco:PMD_0050032']}
    names:
      bafu: ['^synthetic rubber']
  m0041:
    label: silicone rubber
    definition: Elastomer with a silicon-oxygen backbone, heat resistant and flexible over a wide temperature range.
    source: https://www.wikidata.org/wiki/Q4115245
    example: [a silicone keypad, a silicone oven door seal, a silicone cable sheath, a silicone hose from a coffee machine]
    note: 'Not synthetic rubber: silicone rubber has its own concept here. Silicone grease and oil are not rubber.'
    editorial_note: BAFU's silicone product is a proxy for silicone rubber. Wikidata counts silicone rubber as a synthetic rubber.
    broader: [m0038]
    mappings: {exact: ['pmdco:PMD_0090052', 'wd:Q4115245']}
    names:
      bafu: ['^silicone product']
  m0042:
    label: thermoplastic elastomer
    definition: Elastomer that softens on heating and can be remelted, as in overmoulded grips and soft cable sheaths.
    source: https://www.wikidata.org/wiki/Q146527
    example: [a soft-touch grip on a tool, TPU, a TPE cable sheath, a styrenic block copolymer seal]
    note: 'TPE. Not thermoplastic: a plastic that stays hard is a thermoplastic. Not synthetic rubber: vulcanised rubber cannot be remelted.'
    editorial_note: Wikidata also lists it under thermoplastic; here it is an elastomer only.
    broader: [m0038]
    mappings: {exact: ['wd:Q146527']}
  m0043:
    label: glass
    definition: Amorphous inorganic solid, mostly silica-based, as in screens, covers and bulbs.
    source: Ashby, Materials Selection in Mechanical Design, 5th ed., 2017, sec. 2.2
    example: [soda-lime glass, borosilicate glass, a phone's cover glass, CRT glass]
    note: 'Not ceramic: ceramics are crystalline. Not polymer: clear acrylic or polycarbonate panels are polymers.'
    mappings: {exact: ['pmdco:PMD_0000661', 'wd:Q11469'], close: ['cpc:371']}
  m0044:
    label: soda-lime glass
    definition: Glass of silica, soda and lime, the common glass of windows, bottles, lamp bulbs and appliance panels.
    source: https://www.wikidata.org/wiki/Q745127
    example: [a microwave door pane, a lamp bulb, a scanner glass plate, window glass]
    note: 'Not other glass: borosilicate glass, aluminosilicate cover glass and leaded CRT glass stay at glass. Tempered soda-lime glass, as in an oven door, is included.'
    broader: [m0043]
    mappings: {exact: ['pmdco:PMD_0050102', 'wd:Q745127'], broad: ['cpc:3711']}
    names:
      bafu: ['^flat glass, ']
  m0045:
    label: glass fibre
    definition: Glass drawn into fine filaments, loose or as wool, mat, yarn or fabric.
    source: https://www.wikidata.org/wiki/Q5861
    example: [glass wool insulation, a glass fibre sleeve on a heating element, a glass fibre mat, chopped glass fibre]
    note: 'Not glass-fibre reinforced polymer: fibres set in resin, as in FR-4, are a composite. Not textile: woven glass fabric goes here.'
    broader: [m0043]
    mappings: {exact: ['wd:Q5861'], close: ['cpc:3712']}
    names:
      bafu: ['^glass fibre, at plant']
  m0046:
    label: ceramic
    definition: Inorganic non-metallic crystalline solid formed by heat, Ashby's ceramic family.
    source: Ashby, Materials Selection in Mechanical Design, 5th ed., 2017, sec. 2.2
    example: [a porcelain insulator, an alumina circuit substrate, a ferrite core, stoneware]
    note: 'Not glass: glass is amorphous and has its own concept.'
    editorial_note: Wikidata's ceramic does not require a crystalline structure.
    mappings: {exact: ['pmdco:PMD_0000546'], close: ['wd:Q45621']}
  m0047:
    label: technical ceramic
    definition: Ceramic of refined oxides, carbides or nitrides, such as alumina, zirconia or silicon carbide, made for technical parts.
    source: https://w3id.org/pmd/co/PMD_0050054
    example: [an alumina substrate, a ceramic fuse body, a zirconia oxygen sensor, a silicon carbide heating element]
    note: 'Not ferrite: magnetic iron oxide ceramics have their own class. Clay ceramics such as stoneware and tableware stay at ceramic.'
    broader: [m0046]
    mappings: {exact: ['pmdco:PMD_0050054'], broad: ['cpc:37291']}
  m0048:
    label: ferrite
    definition: Ceramic of iron oxide combined with other metal oxides, often magnetic, as in ferrite cores and magnets.
    source: https://www.wikidata.org/wiki/Q114047906
    example: [a ferrite toroid core, a ferrite bead on a cable, a ferrite loudspeaker magnet, a ferrite rod from a radio antenna]
    note: 'Not ferrous metal: ferrite is an oxide, not an alloy, and the ferrite phase of steel is steel. Not technical ceramic, though ferrites are engineered ceramics too.'
    broader: [m0046]
    mappings: {exact: ['wd:Q114047906']}
    names:
      bafu: ['^ferrite']
  m0049:
    label: hybrid material
    definition: Family of materials made of more than one constituent, such as composites, foams, natural materials and textiles, as Ashby groups them.
    source: Ashby, Materials Selection in Mechanical Design, 5th ed., 2017, sec. 2.2
    example: [FR-4, a carbon-fibre panel, plywood, a foam gasket]
    note: 'Not a part of separate materials: a part that can be taken apart is recorded by each material. Covers composites, foams, natural materials and textiles.'
  m0050:
    label: composite
    definition: Material in which a matrix holds fibres or particles of another material, as in fibre-reinforced plastics and laminates.
    source: https://www.wikidata.org/wiki/Q181790
    example: [glass-fibre reinforced polymer, carbon-fibre reinforced polymer, FR-2 paper-phenolic board, cement-bonded particle board]
    note: 'Not textile: fibres without a matrix are textile, except glass fibres, which are glass fibre. Paper or foil laminated with plastic goes by its main material.'
    broader: [m0049]
    mappings: {exact: ['pmdco:PMD_0000577', 'wd:Q181790']}
  m0051:
    label: glass-fibre reinforced polymer
    definition: Composite of glass fibre set in a polymer resin, as in fibreglass sheet, laminates and moulded resin parts.
    source: https://www.wikidata.org/wiki/Q7224880
    example: [a fibreglass enclosure, a GRP panel, a glass-fibre epoxy sheet, FR-4]
    note: 'GFRP, GRP, fibreglass. Not glass fibre: bare fibre without resin is glass fibre. Not glass-filled plastic: short-fibre moulding grades such as PA66-GF30 go by their polymer.'
    broader: [m0050]
    mappings: {exact: ['pmdco:PMD_0090008', 'wd:Q7224880']}
    names:
      bafu: ['^glass fibre reinforced plastic']
  m0052:
    label: FR-4 laminate
    definition: Flame-retardant glass-fibre epoxy laminate, the usual circuit board substrate.
    source: https://www.wikidata.org/wiki/Q2466079
    example: [a plain FR-4 sheet, an FR-4 insulating spacer, a copper-clad FR-4 offcut]
    note: 'Not printed circuit board: a board, bare or populated, is a component, and FR-4 is its material. Other board laminates such as FR-2 paper-phenolic are composite.'
    broader: [m0051]
    mappings: {exact: ['wd:Q2466079']}
  m0053:
    label: foam
    definition: Solid with gas-filled cells throughout, as in packaging, padding and insulation.
    source: https://www.wikidata.org/wiki/Q215414
    example: [an unmarked packaging foam sheet, an acoustic foam pad, a foam gasket, foam padding in a headphone cushion]
    note: 'Not polyurethane, polystyrene or polyethylene: a foam whose polymer is known goes by that polymer, such as PUR foam or EPS. A metal foam goes by its metal. Only solid foams count.'
    editorial_note: Wikidata's foam also counts liquid foams, and PMDco's foam allows a liquid matrix.
    broader: [m0049]
    mappings: {close: ['wd:Q215414', 'pmdco:PMD_0020126']}
  m0054:
    label: natural material
    definition: Material from plants or animals used with its natural structure kept, such as wood, paper, leather and cork.
    source: https://www.wikidata.org/wiki/Q2451477
    example: [wood, cardboard, leather, cork]
    note: 'Not polymer: biobased plastics such as PLA are polymers. Processed forms such as paper, board and tanned leather count.'
    editorial_note: Wikidata's natural material leaves out processed forms.
    broader: [m0049]
    mappings: {close: ['wd:Q2451477']}
  m0055:
    label: wood
    note: 'Not paper and board: cardboard is paper and board, but fibreboard and particle board are wood. Not composite: cement-bonded particle board is a composite.'
    definition: Fibrous material from trees, solid or as engineered board.
    source: https://www.wikidata.org/wiki/Q287
    example: [solid wood, plywood, MDF, particle board]
    broader: [m0054]
    mappings: {exact: ['wd:Q287'], broad: ['cpc:31']}
    names:
      bafu: ['^(fibreboard|particle board)(?!, cement bonded)']
  m0056:
    label: paper and board
    example: [corrugated cardboard, paperboard packaging, a paper label, a paper insulation sheet from a transformer]
    definition: Sheet material of pressed plant fibres, from thin paper to corrugated cardboard.
    source: https://www.wikidata.org/wiki/Q11472
    note: 'Not wood: fibreboard and particle board are wood. Paper laminated with plastic or foil goes by its main material.'
    broader: [m0054]
    mappings: {close: ['wd:Q11472', 'cpc:321']}
    names:
      bafu: ['^corrugated board', '^kraft paper']
  m0057:
    label: textile
    note: 'Not polymer: a solid plastic part is a polymer, even when the same plastic is also spun into fibre. Not composite: fibres set in resin, as in FR-4, are a composite. Woven glass fabric is glass fibre.'
    definition: Material made of fibres, woven, knitted or non-woven.
    source: https://www.wikidata.org/wiki/Q28823
    example: [cotton fabric, polyester felt, a nylon strap, a fabric speaker grille]
    broader: [m0049]
    mappings: {exact: ['wd:Q28823'], broad: ['cpc:26']}
  m0058:
    label: leather
    definition: Animal hide made durable and flexible by tanning.
    source: https://www.wikidata.org/wiki/Q286
    example: [a leather watch strap, a leather phone case, leather upholstery, a leather carrying handle]
    note: 'Not polymer: artificial leather of PU or PVC goes by its polymer. Not textile: leather is hide, not fibre.'
    broader: [m0054]
    mappings: {exact: ['wd:Q286'], broad: ['cpc:29']}
