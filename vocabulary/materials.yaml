    example: [sheet steel, stainless steel 18/8, grey cast iron]
    note: Not non-ferrous metal. Wikidata's ferrous metal also counts alloys based on chromium, manganese, cobalt or nickel; here those are non-ferrous.
    broader: [m0001]
    mappings: {exact: ['pmdco:PMD_0000639', 'wd:Q65122087'], close: ['cpc:411']}
