# Component classes: parts whose footprint is set by what they are rather than by one
# material. Battery, PCB, cable and magnet moved here from the material axis. Mappings and `names` patterns as in materials.yaml.
scheme:
  slug: components
  id_letter: c
  title: R9lab component classes
  created: 2026-11-17
  description: >
    Component classes for parts recovered from disassembled products, with crosswalks to
    CPC 2.1, Wikidata and BAFU activity names.
concepts:
  c0001:
    label: battery
    definition: One or more electrochemical cells fitted with what they need for use, such as a case, terminals and protective devices.
    source: IEC 60050-482:2004, 482-01-04
    example: [a phone's lithium-ion pouch battery, a laptop battery pack, an AA cell, a coin cell]
    note: 'Not lithium-ion cell: a bare cell cut out of a pack has none of the pack''s case or protection. Not populated printed circuit board: a pack''s protection board belongs to the battery.'
    mappings: {exact: ['wd:Q267298'], close: ['cpc:464']}
  c0002:
    label: lithium-ion battery
    definition: Rechargeable battery of one or more lithium-ion cells with its casing and connections, as removed from a product.
    source: https://www.wikidata.org/wiki/Q2822895
    example: [a phone's lithium-ion pouch battery, a laptop battery pack, a power-bank battery, a cordless-drill battery pack]
    note: 'Not lithium-ion cell: a bare cell cut out of a pack has none of the pack''s case or protection. Includes lithium-polymer pouch batteries. A pack''s protection board belongs to the battery.'
    editorial_note: BAFU has no LiCoO2 battery, the usual phone and tablet chemistry; NMC is the nearest.
    broader: [c0001]
    mappings: {exact: ['wd:Q2822895'], broad: ['cpc:46420']}
    names:
      bafu: ['^battery, (li-?ion|liio)', '^battery, rechargeable, prismatic, lincm']
  c0003:
    label: nickel-metal hydride battery
    definition: Rechargeable battery of one or more nickel-metal hydride cells with its casing and connections.
    source: https://www.wikidata.org/wiki/Q308567
    example: [a rechargeable AA cell, a cordless-phone battery pack, an older shaver battery, a toothbrush battery]
    note: 'Not primary cell: a NiMH cell is made to be recharged, even when it has the same size as an alkaline AA. Not nickel-cadmium: a NiCd battery goes to battery.'
    broader: [c0001]
    mappings: {exact: ['wd:Q308567'], broad: ['cpc:46420']}
    names:
      bafu: ['^battery, nimh']
  c0004:
    label: primary cell
    definition: Battery made to be used once and not recharged, usually a single cell in a standard size.
    source: https://www.wikidata.org/wiki/Q1378887
    example: [an alkaline AA cell, a zinc-carbon AAA cell, a CR2032 lithium coin cell, a 9 V block battery]
    note: 'Alkaline, zinc-carbon and coin cells. Not lithium-ion battery: a lithium coin cell is primary and belongs here. Not nickel-metal hydride battery, which is rechargeable.'
    editorial_note: No BAFU dataset.
    broader: [c0001]
    mappings: {exact: ['wd:Q1378887'], close: ['cpc:46410']}
  c0005:
    label: bare printed circuit board
    definition: 'Printed circuit board without mounted components: the insulating board with its conductive tracks.'
    source: https://www.wikidata.org/wiki/Q173350
    example: [an unpopulated FR-4 board, a flexible printed circuit without parts, a board with every part desoldered]
    note: 'Not populated printed circuit board: a board that still carries components is populated. Not FR-4 laminate, which is the board''s material.'
    mappings: {exact: ['wd:Q173350'], close: ['cpc:47130']}
    names:
      bafu: ['^printed wiring board, (surface mount|through-hole), .*surface']
  c0006:
    label: populated printed circuit board
    definition: Printed circuit board with its electronic components mounted, also called a printed circuit board assembly.
    source: https://www.wikidata.org/wiki/Q3951866
    example: [a motherboard, a phone logic board, a power-supply board, a hard-drive controller board]
    note: 'Not bare printed circuit board, which has no components. Not electronic component: a part still soldered on stays part of the board.'
    related: [c0005]
    mappings: {exact: ['wd:Q3951866']}
    names:
      bafu: ['^printed wiring board, (surface mounted|through-hole mounted|mixed mounted)', 'mainboard', '^printed wiring board, power supply unit']
  c0007:
    label: electronic component
    definition: Discrete electronic part, such as a chip, capacitor, resistor or LED, recorded loose, not soldered to a board.
    source: https://www.wikidata.org/wiki/Q11653
    example: [an integrated circuit, an electrolytic capacitor, a resistor, a quartz crystal]
    note: 'Not populated printed circuit board: a board recorded whole, parts and all, is one item. Not transformer or electric motor, which are concepts of their own.'
    mappings: {exact: ['wd:Q11653']}
    names:
      bafu: ['^electronic component, (active|passive), unspecified']
  c0008:
    label: integrated circuit
    definition: Electronic circuit formed on a small piece of semiconductor, sealed in a package with pins or pads, such as a processor or memory chip.
    source: https://www.wikidata.org/wiki/Q80831
    example: [a CPU, a DRAM chip, a flash memory chip, a microcontroller]
    note: 'Not populated printed circuit board: a chip still soldered on stays part of the board, and a memory module is a board. Here it means the packaged chip.'
    editorial_note: Wikidata's item is the circuit itself.
    broader: [c0007]
    mappings: {close: ['cpc:47160', 'wd:Q80831']}
    names:
      bafu: ['^integrated circuit']
  c0009:
    label: capacitor
    definition: Passive two-terminal electronic component that stores energy in an electric field.
    source: https://www.wikidata.org/wiki/Q5322
    example: [an aluminium electrolytic capacitor, a ceramic chip capacitor, a film capacitor, a tantalum capacitor]
    note: 'Not battery: a capacitor, supercapacitors included, stores charge, not chemical energy. Not populated printed circuit board: a capacitor still soldered on stays part of the board.'
    broader: [c0007]
    mappings: {exact: ['wd:Q5322'], close: ['cpc:47110']}
    names:
      bafu: ['^capacitor']
  c0010:
    label: resistor
    definition: Passive electronic component used for its electrical resistance.
    source: https://www.wikidata.org/wiki/Q5321
    example: [a carbon-film resistor, a surface-mount chip resistor, a potentiometer, a thermistor]
    note: 'Not populated printed circuit board: a resistor still soldered on stays part of the board. Includes variable resistors such as potentiometers and thermistors.'
    broader: [c0007]
    mappings: {exact: ['wd:Q5321'], close: ['cpc:47120']}
    names:
      bafu: ['^resistor']
  c0011:
    label: light-emitting diode
    definition: Semiconductor diode that gives off light when current flows through it, as a single part.
    source: https://www.wikidata.org/wiki/Q25504
    example: [a through-hole indicator LED, a surface-mount LED, an LED from a backlight strip, an infrared LED from a remote control]
    note: 'Not LED or OLED display: a screen built from LEDs is a display. Not LED lamp, which is a product. Here it means the discrete part.'
    editorial_note: Wikidata's light-emitting diode is any such light source.
    broader: [c0007]
    mappings: {close: ['wd:Q25504'], broad: ['cpc:47150']}
    names:
      bafu: ['^light emitting diode']
  c0012:
    label: inductor
    definition: Passive two-terminal component that stores energy in its magnetic field, usually a coil of wire, often round a ferrite core.
    source: https://www.wikidata.org/wiki/Q5325
    example: [a toroidal choke, a surface-mount power inductor, a surface-mount ferrite bead, a common-mode choke from a power supply]
    note: 'Not transformer: an inductor works on one circuit, a transformer couples two or more. Wire unwound from an inductor goes by its metal.'
    broader: [c0007]
    mappings: {exact: ['wd:Q5325'], broad: ['cpc:46122']}
    names:
      bafu: ['^inductor']
  c0013:
    label: transformer
    definition: Electrical device that transfers energy from one circuit to another by electromagnetic induction, built from windings on a core.
    source: https://www.wikidata.org/wiki/Q11658
    example: [a mains transformer from an old power supply, a ferrite transformer from a switched-mode charger, a microwave-oven transformer, a doorbell transformer]
    note: 'Not inductor, which has a single circuit. Not electronic component: small board-mounted transformers also go here. Wire unwound from a transformer goes by its metal.'
    mappings: {exact: ['wd:Q11658'], close: ['cpc:46121']}
  c0014:
    label: display
    example: [a phone screen module, a laptop LCD panel, an OLED smartwatch display, an e-reader's e-paper display]
    definition: Electronic visual display panel or module that shows images or text, such as an LCD or OLED panel.
    source: https://www.wikidata.org/wiki/Q6021804
    note: 'Not glass: a loose cover glass is a material. Not a whole monitor or television, which is a product.'
    mappings: {exact: ['wd:Q6021804']}
  c0015:
    label: liquid-crystal display
    definition: Display panel or module that forms images with liquid crystals, lit by a backlight or by reflected light.
    source: https://www.wikidata.org/wiki/Q83341
    example: [a laptop LCD panel, a phone LCD module, a calculator's segment display, an LCD backlight unit]
    note: 'Not LED or OLED display: an LCD with an LED backlight is still an LCD. Not a whole monitor or television, which is a product. Includes the backlight unit, on its own or with the panel.'
    editorial_note: BAFU's "LCD flat screen, 17 inches" is a whole computer monitor (housing, circuit board and LCD module), so it is left out. Wikidata's liquid-crystal display is the panel; a backlight unit on its own is included here.
    broader: [c0014]
    mappings: {close: ['wd:Q83341']}
    names:
      bafu: ['^lcd (glass|module|screen)', '^backlight, lcd']
  c0016:
    label: LED or OLED display
    definition: Display panel or module whose image is made directly by light-emitting diodes, inorganic or organic (OLED), with no liquid-crystal layer.
    source: https://www.wikidata.org/wiki/Q9197445
    example: [an OLED phone screen module, an AMOLED smartwatch display, a seven-segment LED display, an LED matrix panel]
    note: 'Not liquid-crystal display: an LCD lit by an LED backlight is an LCD. Not light-emitting diode, which is a single loose LED.'
    broader: [c0014]
    mappings: {close: ['wd:Q9197445']}
    names:
      bafu: ['^(led|oled) (module|screen)']
  c0017:
    label: cable
    note: 'Not a bare conductor: an uninsulated copper strip or braid goes by its metal. So does enamelled winding wire in a coil, motor or transformer. Not a flexible printed circuit, which is a printed circuit board. Wikidata''s cable does not ask for insulation; this scheme does.'
    definition: 'Electric cable or wire: one or more insulated conductors, with or without plugs.'
    source: https://www.wikidata.org/wiki/Q188447
    example: [a power cord, a USB cable, an internal wire harness, a ribbon cable]
    mappings: {exact: ['wd:Q188447'], close: ['cpc:463']}
    names:
      bafu: ['^cable, ', '^plugs, inlet and outlet']
  c0018:
    label: magnet
    example: [a loudspeaker magnet, a hard-drive voice-coil magnet, an electromagnet from a door lock, a magnetic catch]
    definition: Material or object that produces a magnetic field, permanent or electromagnetic.
    source: https://www.wikidata.org/wiki/Q11421
    note: 'Not ferrous metal: a steel part a magnet sticks to is not a magnet. Not electric motor, which holds magnets but is a concept of its own.'
    editorial_note: Pilot class s09 (permanent magnet) maps to permanent magnet (c0019), not here.
    mappings: {exact: ['wd:Q11421'], broad: ['cpc:4693']}
  c0019:
    label: permanent magnet
    definition: Magnet made of a material that keeps its own magnetic field without an electric current.
    source: https://www.wikidata.org/wiki/Q353743
    example: [a loudspeaker ring magnet, a fridge door-seal magnet strip, a hard-drive voice-coil magnet, a magnetic catch]
    note: 'Not electromagnet: a coil that is magnetic only while current flows stays under magnet. Not electric motor, which holds magnets but is a concept of its own.'
    broader: [c0018]
    mappings: {exact: ['wd:Q353743']}
  c0020:
    label: neodymium magnet
    definition: Permanent magnet made of an alloy of neodymium, iron and boron (NdFeB), the strongest common kind.
    source: https://www.wikidata.org/wiki/Q908880
    example: [a hard-drive voice-coil magnet, an earbud speaker magnet, a phone vibration-motor magnet, a nickel-plated disc magnet]
    note: 'Not ferrite magnet, which is a dark grey ceramic and much weaker. Not samarium-cobalt: that rare-earth magnet goes to permanent magnet.'
    editorial_note: BAFU's only dataset comes from the electric-vehicle motor chain.
    broader: [c0019]
    mappings: {exact: ['wd:Q908880'], broad: ['cpc:46931']}
    names:
      bafu: ['^permanent magnet']
  c0021:
    label: ferrite magnet
    definition: Permanent magnet made of ferrite, a ceramic of iron oxide with barium or strontium, either sintered or bonded in rubber or plastic.
    source: https://www.wikidata.org/wiki/Q5105088
    example: [a loudspeaker ring magnet, a fridge door-seal magnet strip, a small DC motor's arc magnet, a microwave magnetron magnet]
    note: 'Not ferrite: a ferrite inductor core or a clip-on ferrite on a cable is not a magnet and goes by its material. Not neodymium magnet, which is metallic and much stronger.'
    broader: [c0019]
    mappings: {exact: ['wd:Q5105088'], close: ['cpc:46932'], related: ['materials:m0048']}
  c0022:
    label: electric motor
    definition: Electromechanical device that turns electrical energy into motion, usually by rotation.
    source: https://www.wikidata.org/wiki/Q72313
    example: [a fan motor, a vibration motor from a phone, a stepper motor from a printer, a hard-drive spindle motor]
    note: 'Not magnet: a magnet taken out of a motor is recorded as a magnet. Not transformer, which has windings but no moving parts.'
    editorial_note: Small motors; BAFU has only electric-vehicle and scooter motors.
    mappings: {exact: ['wd:Q72313'], broad: ['cpc:46111']}
  c0023:
    label: loudspeaker driver
    definition: Electroacoustic transducer that turns an electrical audio signal into sound, as a single unit of cone or diaphragm, coil and magnet.
    source: https://www.wikidata.org/wiki/Q570
    example: [a laptop speaker unit, a phone earpiece speaker, a woofer from a speaker box, an earbud driver]
    note: 'Not speaker, which is the whole stand-alone product with its enclosure. Not magnet: a magnet taken out of a driver is recorded as a magnet. Here it means the driver unit only.'
    editorial_note: No BAFU dataset. Wikidata's loudspeaker also covers a whole speaker box.
    mappings: {close: ['wd:Q570'], broad: ['cpc:47330']}
  c0024:
    label: lithium-ion cell
    definition: Single lithium-ion electrochemical cell, the unit a lithium-ion battery is built from.
    example: [an 18650 cell from a laptop pack, a pouch cell cut from a phone battery, a prismatic cell, a 21700 cell]
    note: 'Not lithium-ion battery: a cell still fitted with the pack''s case, wiring or protection board is the battery.'
    editorial_note: Part of a battery, not a kind of battery, so it has no broader concept.
    related: [c0002]
    mappings: {broad: ['wd:Q80097', 'cpc:46420']}
    names:
      bafu: ['^battery cell, ']
