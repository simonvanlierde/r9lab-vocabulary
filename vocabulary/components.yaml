# Component classes: parts whose footprint is set by what they are rather than by one
# material (ruling of 5 November 2026: battery, PCB, cable and magnet move here from
# the material axis). Mappings and `names` patterns as in materials.yaml.
scheme:
  slug: components
  id_letter: c
  title: R9lab component classes
  description: >
    Component classes for parts recovered from disassembled products, with crosswalks to
    CPC 2.1, Wikidata and BAFU activity names.
concepts:
  c0001:
    label: battery
    definition: One or more electrochemical cells fitted with what they need for use, such as a case, terminals and protective devices.
    source: IEC 60050-482:2004, 482-01-04
    example: [a phone's lithium-ion pouch battery, a laptop battery pack, an AA cell, a coin cell]
    note: 'Not lithium-ion cell: a bare cell cut out of a pack has none of the pack''s case or protection. Not populated printed circuit board: a pack''s protection board belongs to the battery.'
    mappings: {exact: ['wd:Q267298'], close: ['cpc:464']}
  c0002:
    label: lithium-ion battery
    note: BAFU has no LiCoO2 battery, the usual phone and tablet chemistry; NMC is the nearest.
    broader: [c0001]
    mappings: {exact: ['wd:Q2822895'], broad: ['cpc:46420']}
    names:
      bafu: ['^battery, (li-?ion|liio)', '^battery, rechargeable, prismatic, lincm']
  c0003:
    label: nickel-metal hydride battery
    broader: [c0001]
    mappings: {exact: ['wd:Q308567'], broad: ['cpc:46420']}
    names:
      bafu: ['^battery, nimh']
  c0004:
    label: primary cell
    note: Alkaline, zinc-carbon and coin cells. No BAFU dataset.
    broader: [c0001]
    mappings: {exact: ['wd:Q1378887'], close: ['cpc:46410']}
  c0005:
    label: bare printed circuit board
    definition: 'Printed circuit board without mounted components: the insulating board with its conductive tracks.'
    source: https://www.wikidata.org/wiki/Q173350
    example: [an unpopulated FR-4 board, a flexible printed circuit without parts, a board with every part desoldered]
    note: 'Not populated printed circuit board: a board that still carries components is populated. Not FR-4 laminate, which is the board''s material.'
    mappings: {exact: ['wd:Q173350'], close: ['cpc:47130']}
    names:
      bafu: ['^printed wiring board, (surface mount|through-hole), .*surface']
  c0006:
    label: populated printed circuit board
    definition: Printed circuit board with its electronic components mounted, also called a printed circuit board assembly.
    source: https://www.wikidata.org/wiki/Q3951866
    example: [a motherboard, a phone logic board, a power-supply board, a hard-drive controller board]
    note: 'Not bare printed circuit board, which has no components. Not electronic component: a part still soldered on stays part of the board.'
    related: [c0005]
    mappings: {exact: ['wd:Q3951866']}
    names:
      bafu: ['^printed wiring board, (surface mounted|through-hole mounted|mixed mounted)', 'mainboard', '^printed wiring board, power supply unit']
  c0007:
    label: electronic component
    definition: Discrete electronic part, such as a chip, capacitor, resistor or LED, mounted on a board or loose.
    source: https://www.wikidata.org/wiki/Q11653
    example: [an integrated circuit, an electrolytic capacitor, a resistor, a quartz crystal]
    note: 'Not populated printed circuit board: a board recorded whole, parts and all, is one item. Not transformer or electric motor, which are concepts of their own.'
    mappings: {exact: ['wd:Q11653']}
    names:
      bafu: ['^electronic component, (active|passive), unspecified']
  c0008:
    label: integrated circuit
    broader: [c0007]
    mappings: {exact: ['wd:Q80831'], close: ['cpc:47160']}
    names:
      bafu: ['^integrated circuit']
  c0009:
    label: capacitor
    broader: [c0007]
    mappings: {exact: ['wd:Q5322'], close: ['cpc:47110']}
    names:
      bafu: ['^capacitor']
  c0010:
    label: resistor
    broader: [c0007]
    mappings: {exact: ['wd:Q5321'], close: ['cpc:47120']}
    names:
      bafu: ['^resistor']
  c0011:
    label: light-emitting diode
    broader: [c0007]
    mappings: {exact: ['wd:Q25504'], broad: ['cpc:47150']}
    names:
      bafu: ['^light emitting diode']
  c0012:
    label: inductor
    broader: [c0007]
    mappings: {exact: ['wd:Q5325'], broad: ['cpc:46122']}
    names:
      bafu: ['^inductor']
  c0013:
    label: transformer
    mappings: {exact: ['wd:Q11658'], close: ['cpc:46121']}
  c0014:
    label: display
    definition: Electronic visual display panel or module that shows images or text, such as an LCD or OLED panel.
    source: https://www.wikidata.org/wiki/Q6021804
    example: [a phone screen module, a laptop LCD panel, an OLED smartwatch display, a monitor's LCD panel]
    note: 'Not glass: a loose cover glass is a material. Not a whole monitor or television, which is a product.'
    mappings: {exact: ['wd:Q6021804']}
  c0015:
    label: liquid-crystal display
    note: BAFU's "LCD flat screen, 17 inches" is a whole computer monitor (housing, circuit board and LCD module), so it is left out.
    broader: [c0014]
    mappings: {exact: ['wd:Q83341']}
    names:
      bafu: ['^lcd (glass|module|screen)', '^backlight, lcd']
  c0016:
    label: LED or OLED display
    broader: [c0014]
    mappings: {broad: ['wd:Q209593']}
    names:
      bafu: ['^(led|oled) (module|screen)']
  c0017:
    label: cable
    definition: 'Electric cable or wire: one or more insulated conductors, with or without plugs.'
    source: https://www.wikidata.org/wiki/Q188447
    example: [a power cord, a USB cable, an internal wire harness, a ribbon cable]
    note: 'Not a bare conductor: an uninsulated copper strip or braid goes by its metal. Not a flexible printed circuit, which is a printed circuit board.'
    mappings: {exact: ['wd:Q188447'], close: ['cpc:463']}
    names:
      bafu: ['^cable, ', '^plugs, inlet and outlet']
  c0018:
    label: magnet
    definition: Material or object that produces a magnetic field, permanent or electromagnetic.
    source: https://www.wikidata.org/wiki/Q11421
    example: [a loudspeaker magnet, a hard-drive voice-coil magnet, a relay coil, a magnetic catch]
    note: 'Not ferrous metal: a steel part a magnet sticks to is not a magnet. Not electric motor, which holds magnets but is a concept of its own. The pilot''s magnet class means permanent magnet.'
    mappings: {exact: ['wd:Q11421'], broad: ['cpc:4693']}
  c0019:
    label: permanent magnet
    broader: [c0018]
    mappings: {exact: ['wd:Q353743']}
  c0020:
    label: neodymium magnet
    note: NdFeB. BAFU's only dataset comes from the electric-vehicle motor chain.
    broader: [c0019]
    mappings: {exact: ['wd:Q908880'], broad: ['cpc:46931']}
    names:
      bafu: ['^permanent magnet']
  c0021:
    label: ferrite magnet
    broader: [c0019]
    mappings: {exact: ['wd:Q5105088'], close: ['cpc:46932'], related: ['materials:m0048']}
  c0022:
    label: electric motor
    note: Small motors; BAFU has only electric-vehicle and scooter motors.
    mappings: {exact: ['wd:Q72313'], broad: ['cpc:46111']}
  c0023:
    label: loudspeaker driver
    note: No BAFU dataset.
    mappings: {exact: ['wd:Q570'], broad: ['cpc:47330']}
  c0024:
    label: lithium-ion cell
    definition: Single lithium-ion electrochemical cell, the unit a lithium-ion battery is built from.
    note: Part of a battery, not a kind of battery, so it has no broader concept.
    related: [c0002]
    mappings: {broad: ['wd:Q80097', 'cpc:46420']}
    names:
      bafu: ['^battery cell, ']
