# Product types, first cut: the 27 types proposed for the 46 R9lab lab products in the
# 5 November 2026 data check, grouped under six families. Not yet adjudicated, and the
# workshop products and outside uploads are not counted yet. If the corpus needs fewer
# than about 40 classes, a UNU-KEY label plus direct linking replaces this facet
# (decision of 15 November 2026, point 4).
#
# cpc: CPC 2.1 subclass, broad unless the subclass is the type itself. unu1: UNU-KEY v1
# code from the same data check, not yet re-checked against the 2018 guidelines table.
# r9lab-cpv: the CPV code R9lab stores for the type today (truncated as in the app).
scheme:
  slug: products
  id_letter: p
  title: R9lab product types
  created: 2026-11-17
  description: >
    Product types for disassembled consumer products, with crosswalks to CPC 2.1, UNU-KEY v1
    codes, the CPV codes R9lab uses and Wikidata.
