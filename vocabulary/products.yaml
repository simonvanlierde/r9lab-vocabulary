# Product types, first cut: the 27 types proposed for the 46 R9lab lab products in the
# 5 November 2026 data check, grouped under six families. Not yet adjudicated, and the
# workshop products and outside uploads are not counted yet. If the corpus needs fewer
# than about 40 classes, a UNU-KEY label plus direct linking replaces this facet.
#
# cpc: CPC 2.1 subclass, broad unless the subclass is the type itself. unu1 and unu2:
# UNU-KEY v1 and v2 codes, checked against the key descriptions and the HS and CPC tables
# of the E-waste Statistics Guidelines (2nd ed. 2018, 3rd ed. 2026). v2 follows the v1 code
# by Annex 2 of the 3rd edition, except where its HS table moved the product.
# r9lab-cpv: the CPV code R9lab stores for the type today (truncated as in the app).
# weee6: category 1-6 of Annex III to Directive 2012/19/EU (WEEE), derived from the
# unu1 code by the UNU-KEY to EU-6 table of the Global E-waste Monitor 2017 annexes, which
# Table 2 of the 2026 guidelines confirms for every code used here.
# Families get none: they cut across categories.
scheme:
  slug: products
  id_letter: p
  title: R9lab product types
  created: 2026-11-17
  description: >
    Product types for disassembled consumer products, with crosswalks to CPC 2.1, UNU-KEY v1
    and v2 codes, the WEEE Directive categories, the CPV codes R9lab uses and Wikidata.
concepts:
  p0001:
    label: computing equipment
    mappings: {close: ['cpc:452']}
  p0002:
    label: telecommunications equipment
    mappings: {close: ['wd:Q1780509']}
  p0003:
    label: audio and video equipment
    mappings: {close: ['wd:Q581105']}
  p0004:
    label: lighting equipment
    mappings: {close: ['cpc:4653']}
  p0005:
    label: small household appliance
    mappings: {exact: ['wd:Q3558289'], close: ['cpc:4481']}
  p0006:
    label: personal care appliance
    mappings: {broad: ['cpc:44816']}
  p0007:
    label: laptop
    broader: [p0001]
    mappings: {exact: ['wd:Q3962'], broad: ['cpc:45220', 'unu1:0303', 'unu2:0303', 'weee6:2'], close: ['r9lab-cpv:302131']}
  p0008:
    label: tablet
    broader: [p0001]
    mappings: {exact: ['wd:Q155972'], broad: ['cpc:45220', 'unu1:0303', 'unu2:0303', 'weee6:2'], close: ['r9lab-cpv:302132']}
  p0009:
    label: docking station
    broader: [p0001]
    mappings: {exact: ['wd:Q1233773'], broad: ['cpc:45290', 'unu1:0301', 'unu2:0301', 'weee6:6']}
  p0010:
    label: graphics card
    broader: [p0001]
    note: A PC component; whether it is stand-alone EEE is debatable.
    mappings: {exact: ['wd:Q4308'], broad: ['cpc:45290', 'unu1:0302', 'unu2:0302', 'weee6:6'], close: ['r9lab-cpv:3023713']}
  p0011:
    label: computer power supply
    broader: [p0001]
    mappings: {exact: ['wd:Q3972'], broad: ['cpc:46122', 'unu1:0301', 'unu2:0301', 'weee6:6']}
  p0012:
    label: computer mouse
    broader: [p0001]
    mappings: {exact: ['wd:Q7987'], broad: ['cpc:45261', 'unu1:0301', 'unu2:0301', 'weee6:6'], close: ['r9lab-cpv:3023741']}
  p0013:
    label: computer keyboard
    broader: [p0001]
    mappings: {exact: ['wd:Q250'], broad: ['cpc:45261', 'unu1:0301', 'unu2:0301', 'weee6:6'], close: ['r9lab-cpv:3023746']}
  p0014:
    label: laptop charger
    definition: External power adapter for a laptop.
    broader: [p0001]
    mappings: {close: ['wd:Q887369', 'r9lab-cpv:31158'], broad: ['cpc:46122', 'unu1:0301', 'unu2:0301', 'weee6:6']}
  p0015:
    label: mobile phone
    broader: [p0002]
    note: All mobile phones in the corpus so far are smartphones.
    mappings: {narrow: ['wd:Q22645'], broad: ['cpc:47222', 'unu1:0306', 'unu2:0306', 'weee6:6'], close: ['r9lab-cpv:3225']}
  p0016:
    label: desk phone
    definition: Wired desk telephone, including IP phones.
    broader: [p0002]
    mappings: {close: ['wd:Q943687'], broad: ['cpc:47223', 'unu1:0305', 'unu2:0305', 'weee6:6'], related: ['r9lab-cpv:325521']}
  p0017:
    label: router
    note: Includes home gateways.
    broader: [p0002]
    mappings: {exact: ['wd:Q5318'], broad: ['cpc:47223', 'unu1:0301', 'unu2:0301', 'weee6:6'], close: ['r9lab-cpv:324131']}
  p0018:
    label: GPS navigation device
    broader: [p0002]
    mappings: {exact: ['wd:Q1486497'], broad: ['cpc:48220', 'unu1:0402', 'unu2:0402', 'weee6:5'], close: ['r9lab-cpv:381121']}
  p0019:
    label: headphones
    broader: [p0003]
    mappings: {exact: ['wd:Q186819'], broad: ['cpc:47330', 'unu1:0401', 'unu2:0401', 'weee6:5'], close: ['r9lab-cpv:323421']}
  p0020:
    label: speaker
    definition: Stand-alone loudspeaker product, wired or Bluetooth.
    broader: [p0003]
    mappings: {broad: ['cpc:47330', 'unu1:0405', 'unu2:0405', 'weee6:5'], close: ['r9lab-cpv:32342']}
  p0021:
    label: radio
    note: Includes clock radios.
    broader: [p0003]
    # Mains and clock radios (HS 852713, 852791, 852792) are 0402 in the 2018 HS table and
    # 0403 in the 2026 one, though Annex 2 maps v1 0402 to v2 0402.
    mappings: {broad: ['cpc:47311', 'unu1:0402', 'unu2:0403', 'weee6:5'], close: ['r9lab-cpv:323442']}
  p0022:
    label: remote control
    broader: [p0003]
    mappings: {exact: ['wd:Q185091'], broad: ['cpc:48220', 'unu1:0401', 'unu2:0401', 'weee6:5'], close: ['r9lab-cpv:3882']}
  p0023:
    label: LED lamp
    definition: Lamp that makes light with light-emitting diodes, made to fit a standard lamp holder.
    source: https://www.wikidata.org/wiki/Q1553201
    example: [an E27 LED bulb, a GU10 LED spot, an LED filament bulb, an LED retrofit tube]
    note: 'Not luminaire: a light fitting with built-in LEDs that cannot be swapped out is a luminaire. Luminaires sit in UNU-KEY 0506 and WEEE category 5, LED lamps in 0505 and category 3.'
    broader: [p0004]
    mappings: {exact: ['wd:Q1553201'], broad: ['cpc:46510', 'unu1:0505', 'unu2:0505', 'weee6:3'], close: ['r9lab-cpv:31531']}
  p0024:
    label: luminaire
    definition: Light fitting that holds, powers and directs the light of one or more lamps or built-in light sources.
    source: https://www.wikidata.org/wiki/Q815738
    example: [a desk lamp, a ceiling light, a floor lamp, an LED panel light]
    note: 'Not LED lamp: a replaceable lamp taken out of the fitting is a lamp of its own (UNU-KEY 0505, WEEE category 3). Wikidata labels this item light fixture.'
    broader: [p0004]
    mappings: {exact: ['wd:Q815738'], broad: ['cpc:4653', 'unu1:0506', 'unu2:0506', 'weee6:5'], related: ['r9lab-cpv:31521']}
  p0025:
    label: electric kettle
    definition: Electric appliance that boils water in a jug with a built-in heating element.
    source: https://www.wikidata.org/wiki/Q1364042
    example: [a cordless jug kettle on a base, a travel kettle, a gooseneck kettle, a glass kettle]
    note: 'Not toaster: a kettle heats water, and sits in UNU-KEY 0203 rather than 0202. A coffee machine also heats water but brews, and is not this type.'
    broader: [p0005]
    mappings: {exact: ['wd:Q1364042'], broad: ['cpc:4481', 'unu1:0203', 'unu2:0203', 'weee6:5']}
  p0026:
    label: toaster
    definition: Electric appliance that browns slices of bread between radiant heating elements.
    source: https://www.wikidata.org/wiki/Q14890
    example: [a two-slot pop-up toaster, a four-slice toaster, a long-slot toaster]
    note: Not electric kettle, which heats water (UNU-KEY 0203). Not coffee grinder, which shares UNU-KEY 0202 but grinds with a motor and has no heating element.
    broader: [p0005]
    mappings: {exact: ['wd:Q14890'], broad: ['cpc:44816', 'unu1:0202', 'unu2:0202', 'weee6:5'], close: ['r9lab-cpv:3971133']}
  p0027:
    label: coffee grinder
    definition: Small appliance that grinds roasted coffee beans to powder with motor-driven blades or burrs.
    source: https://www.wikidata.org/wiki/Q1139048
    example: [a blade coffee grinder, a burr coffee grinder, a spice and coffee mill]
    note: Not toaster, which shares UNU-KEY 0202 but heats. Wikidata's coffee grinder includes hand mills; here only powered grinders count.
    broader: [p0005]
    mappings: {close: ['wd:Q1139048'], broad: ['cpc:44816', 'unu1:0202', 'unu2:0202', 'weee6:5']}
  p0028:
    label: clothes iron
    definition: Electric appliance with a heated flat soleplate that is pressed over cloth to smooth it.
    source: https://www.wikidata.org/wiki/Q483634
    example: [a steam iron, a dry iron, a travel iron, a steam generator iron]
    note: 'Not electric kettle: a steam iron holds water but its job is pressing cloth. Wikidata''s clothes iron includes irons heated on a stove; here only electric ones count.'
    broader: [p0005]
    mappings: {close: ['r9lab-cpv:3971351', 'wd:Q483634'], broad: ['cpc:44816', 'unu1:0201', 'unu2:0201', 'weee6:5']}
  p0029:
    label: electric fan
    definition: Electric appliance that moves air with motor-driven blades or an impeller, to cool people or rooms.
    source: https://www.wikidata.org/wiki/Q25841836
    example: [a desk fan, a pedestal fan, a tower fan, a bladeless fan]
    note: Not hair dryer, which heats the air it blows (UNU-KEY 0205 rather than 0201). A cooling fan inside a computer or power supply is a component, not this type.
    broader: [p0005]
    mappings: {exact: ['wd:Q25841836'], close: ['cpc:44815', 'r9lab-cpv:397171'], broad: ['unu1:0201', 'unu2:0201', 'weee6:5']}
  p0030:
    label: power strip
    definition: Block of mains sockets on a flexible cable, sometimes with a switch, surge protection or USB charging ports.
    source: https://www.wikidata.org/wiki/Q1754646
    example: [a six-way extension block, a surge-protected power strip, a power strip with USB ports]
    note: Not laptop charger or computer power supply, which convert power. A power strip passes mains power on, and only its USB ports convert any.
    editorial_note: Whether a passive power strip is electrical and electronic equipment in WEEE scope varies by member state.
    broader: [p0005]
    mappings: {exact: ['wd:Q1754646'], broad: ['cpc:46212', 'unu1:0201', 'unu2:0201', 'weee6:5']}
  p0031:
    label: electric shaver
    definition: Hand-held electric device that cuts hair close to the skin with blades behind a thin foil or under rotary heads.
    source: https://www.wikidata.org/wiki/Q17457835
    example: [a foil shaver, a rotary shaver, a cordless shaver with a charging stand, a lady shaver]
    note: Not electric foot file, which shares UNU-KEY 0205 but sands off hard skin rather than cutting hair.
    broader: [p0006]
    mappings: {exact: ['wd:Q17457835'], broad: ['cpc:44816', 'unu1:0205', 'unu2:0205', 'weee6:5'], close: ['r9lab-cpv:337212']}
  p0032:
    label: hair dryer
    definition: Hand-held electric appliance that blows heated air to dry and style hair.
    source: https://www.wikidata.org/wiki/Q15004
    example: [a hand-held hair dryer, a folding travel hair dryer, a hair dryer with a diffuser]
    note: Not electric fan, which moves air without heating it (UNU-KEY 0201 rather than 0205).
    broader: [p0006]
    mappings: {exact: ['wd:Q15004'], broad: ['cpc:44816', 'unu1:0205', 'unu2:0205', 'weee6:5'], close: ['r9lab-cpv:3971221']}
  p0033:
    label: electric foot file
    definition: Hand-held electric device that removes hard skin from the feet with a rotating abrasive roller.
    example: [a battery foot file with a roller head, a rechargeable callus remover, a foot file with spare rollers]
    note: Not electric shaver, which shares UNU-KEY 0205 but cuts hair. Wikidata's foot file covers manual files too, so it maps as broader.
    broader: [p0006]
    mappings: {broad: ['wd:Q116221616', 'cpc:44816', 'unu1:0205', 'unu2:0205', 'weee6:5']}
