# Product types, first cut: the 27 types proposed for the 46 R9lab lab products in the
# 5 November 2026 data check, grouped under six families. Not yet adjudicated, and the
# workshop products and outside uploads are not counted yet. If the corpus needs fewer
# than about 40 classes, a UNU-KEY label plus direct linking replaces this facet.
#
# cpc: CPC 2.1 subclass, broad unless the subclass is the type itself. unu1 and unu2:
# UNU-KEY v1 and v2 codes, checked against the key descriptions and the HS and CPC tables
# of the E-waste Statistics Guidelines (2nd ed. 2018, 3rd ed. 2026). v2 follows the v1 code
# by Annex 2 of the 3rd edition, except where its HS table moved the product. Where a key's
# description names the product, that key wins over the HS and CPC tables, which map whole
# trade classes coarser than these types.
# r9lab-cpv: the CPV code R9lab stores for the type today (truncated as in the app).
# weee6: category 1-6 of Annex III to Directive 2012/19/EU (WEEE), derived from the
# unu1 code by the UNU-KEY to EU-6 table of the Global E-waste Monitor 2017 annexes, which
# Table 2 of the 2026 guidelines confirms for every code used here.
# Families get none: they cut across categories.
scheme:
  slug: products
  id_letter: p
  title: R9lab product types
  created: 2026-11-17
  description: >
    Product types for disassembled consumer products, with crosswalks to CPC 2.1, UNU-KEY v1
    and v2 codes, the WEEE Directive categories, the CPV codes R9lab uses and Wikidata.
concepts:
